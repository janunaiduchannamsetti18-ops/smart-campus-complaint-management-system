<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .complaint {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Campus Complaints</h1>
</header>

<div class="container">

    <h2>Complaint Status</h2>

    <div class="complaint">
        <h3>Hostel Maintenance</h3>
        <p>Water leakage in hostel room.</p>
        <p class="status">Status: Pending</p>
    </div>

    <div class="complaint">
        <h3>Classroom Maintenance</h3>
        <p>Projector is not working.</p>
        <p class="status">Status: In Progress</p>
    </div>

    <div class="complaint">
        <h3>Library</h3>
        <p>Request for additional study tables.</p>
        <p class="status">Status: Resolved</p>
    </div>

</div>

</body>
</html>
